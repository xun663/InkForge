name: Backend tests

on:
  push:
  pull_request:

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Windows 提交的 mvnw 可能没有可执行位；Linux runner 上 ./mvnw 会秒失败
      - run: chmod +x mvnw
      # 默认 surefire = 单测 + ContinuationRetrievalIT（无 Docker）。Postgres*IT 不进徽章。
      - run: ./mvnw test
      - name: Annotate failing tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          found = False
          for p in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              root = ET.parse(p).getroot()
              for tc in root.iter("testcase"):
                  node = tc.find("failure")
                  if node is None:
                      node = tc.find("error")
                  if node is None:
                      continue
                  found = True
                  cls = tc.get("classname") or "?"
                  name = tc.get("name") or "?"
                  msg = (node.get("message") or (node.text or "failed")).replace("\n", " ")[:350]
                  print(f"::error title={cls}.{name}::{msg}")
          if not found:
              print("::error::mvn test failed but no surefire failure/error XML was found")
          PY
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
